<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>GVSSPICKS</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#060b1a;--glass:rgba(255,255,255,0.045);--glass2:rgba(255,255,255,0.08);
  --glass3:rgba(255,255,255,0.13);--border:rgba(255,255,255,0.09);--border2:rgba(255,255,255,0.18);
  --accent:#7c6dfa;--accent2:#5edcff;--accent3:#fa6d9b;
  --green:#3dfaa0;--red:#fa4d6d;--yellow:#fadb5e;
  --text:#f0f4ff;--text2:#9aaac8;--text3:#5a6f94;--r:16px;--r2:22px;
}
html,body{min-height:100vh;background:var(--bg);font-family:'Inter',sans-serif;color:var(--text);overflow-x:hidden}
.bg-orbs{position:fixed;inset:0;pointer-events:none;z-index:0}
.orb{position:absolute;border-radius:50%;filter:blur(130px);opacity:.15}
.orb1{width:700px;height:700px;background:#7c6dfa;top:-200px;left:-200px}
.orb2{width:500px;height:500px;background:#5edcff;top:35%;right:-100px}
.orb3{width:450px;height:450px;background:#fa6d9b;bottom:-100px;left:25%}
#app{position:relative;z-index:1;max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}

/* HEADER */
header{padding:16px 20px 12px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:200;backdrop-filter:blur(24px);background:rgba(6,11,26,0.88);border-bottom:1px solid var(--border)}
.logo{font-size:19px;font-weight:900;letter-spacing:2px;background:linear-gradient(135deg,#fff 0%,var(--accent2) 55%,var(--accent) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.logo em{font-style:normal;font-weight:300;opacity:.6}
.header-right{display:flex;gap:10px;align-items:center}
.btn-ticket{background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:#fff;font-weight:700;font-size:12px;padding:8px 14px;border-radius:50px;cursor:pointer;display:flex;align-items:center;gap:6px;transition:all .2s;font-family:inherit}
.btn-ticket:hover{transform:scale(1.05);box-shadow:0 0 20px rgba(124,109,250,.5)}
.badge{background:var(--red);border-radius:50%;width:18px;height:18px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900}

/* SPORT TABS */
.sport-tabs{display:flex;gap:0;margin:12px 20px 0;border-radius:16px;background:var(--glass2);border:1px solid var(--border);overflow:hidden}
.stab{flex:1;padding:11px 6px;border:none;background:transparent;color:var(--text3);font-size:12px;font-weight:700;cursor:pointer;transition:all .2s;font-family:inherit;letter-spacing:.5px}
.stab.active{background:rgba(124,109,250,.3);color:#fff}

/* DATE CAROUSEL */
.date-carousel{padding:12px 0 8px;overflow:hidden;position:sticky;top:63px;z-index:199;background:rgba(6,11,26,.9);backdrop-filter:blur(16px)}
.date-scroll{display:flex;gap:8px;overflow-x:auto;padding:0 20px;scrollbar-width:none}
.date-scroll::-webkit-scrollbar{display:none}
.date-chip{flex-shrink:0;display:flex;flex-direction:column;align-items:center;padding:8px 14px;border-radius:14px;cursor:pointer;transition:all .25s;border:1px solid var(--border);background:var(--glass);gap:2px;min-width:54px}
.date-chip.active{background:linear-gradient(135deg,rgba(124,109,250,.35),rgba(94,220,255,.2));border-color:var(--accent2);box-shadow:0 0 16px rgba(94,220,255,.18)}
.date-chip .dn{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:1px}
.date-chip .dd{font-size:18px;font-weight:800}
.date-chip.active .dn,.date-chip.active .dd{color:#fff}
.date-chip.today .dn{color:var(--accent2)}
.has-dot::after{content:'';width:5px;height:5px;border-radius:50%;background:var(--accent2);display:block;margin:2px auto 0}

/* STATS BAR */
.stats-bar{margin:12px 20px 8px;padding:13px 18px;border-radius:var(--r);background:var(--glass2);border:1px solid var(--border);display:flex;justify-content:space-between;backdrop-filter:blur(10px)}
.si{display:flex;flex-direction:column;align-items:center;gap:2px}
.sn{font-size:20px;font-weight:900;background:linear-gradient(135deg,var(--accent2),var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sl{font-size:10px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.8px}
.sdiv{width:1px;background:var(--border)}

/* SOURCE BADGE */
.source-bar{margin:0 20px 10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.src-badge{font-size:10px;font-weight:700;padding:3px 9px;border-radius:50px;border:1px solid var(--border2)}
.src-espn{background:rgba(220,60,60,.1);color:#ff7373;border-color:rgba(220,60,60,.3)}
.src-sofa{background:rgba(94,220,255,.08);color:var(--accent2);border-color:rgba(94,220,255,.2)}
.src-mlb{background:rgba(63,250,160,.08);color:var(--green);border-color:rgba(63,250,160,.2)}
.src-live{background:rgba(63,250,160,.15);color:var(--green);border-color:rgba(63,250,160,.35);animation:blink 1.4s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.5}}
.sync-time{font-size:10px;color:var(--text3);margin-left:auto}

/* RESPONSIBLE */
.resp-bar{margin:0 20px 10px;padding:9px 14px;border-radius:12px;background:rgba(250,219,94,.05);border:1px solid rgba(250,219,94,.12);display:flex;align-items:center;gap:10px}
.resp-bar span{font-size:11px;color:var(--yellow);font-weight:500}
.age{font-size:10px;font-weight:900;background:var(--yellow);color:#0a0c16;padding:2px 7px;border-radius:6px;flex-shrink:0}

/* MATCH LIST */
.matches-list{padding:0 20px 110px;display:flex;flex-direction:column;gap:10px}
.sec-label{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:1.5px;margin:6px 0 4px;display:flex;align-items:center;gap:8px}
.sec-label::after{content:'';flex:1;height:1px;background:var(--border)}

/* MATCH CARD */
.match-card{border-radius:var(--r2);background:var(--glass);border:1px solid var(--border);backdrop-filter:blur(18px);cursor:pointer;transition:all .3s;overflow:hidden;position:relative}
.match-card::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(124,109,250,.05) 0%,transparent 60%);pointer-events:none}
.match-card:hover{transform:translateY(-2px);border-color:var(--border2);box-shadow:0 10px 36px rgba(124,109,250,.16)}
.match-card.live{border-color:rgba(63,250,160,.3);box-shadow:0 0 18px rgba(63,250,160,.07)}
.ct{padding:12px 16px 8px;display:flex;justify-content:space-between;align-items:center}
.li{display:flex;align-items:center;gap:7px}
.li-name{font-size:11px;font-weight:600;color:var(--text3)}
.ms{font-size:11px;font-weight:700;padding:3px 10px;border-radius:50px}
.ms-live{background:rgba(63,250,160,.15);color:var(--green);border:1px solid rgba(63,250,160,.3)}
.ms-pre{background:rgba(94,220,255,.1);color:var(--accent2);border:1px solid rgba(94,220,255,.2)}
.ms-post{background:rgba(160,160,160,.1);color:var(--text3);border:1px solid var(--border)}
.puls{width:6px;height:6px;border-radius:50%;background:var(--green);display:inline-block;margin-right:4px;animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
.cm{padding:4px 16px 12px;display:flex;align-items:center;gap:10px}
.tm{flex:1;display:flex;flex-direction:column;gap:3px}
.tm.away{align-items:flex-end}
.tm-name{font-size:15px;font-weight:700}
.tm-flag{font-size:18px}
.form-dots{display:flex;gap:3px;margin-top:2px}
.fd{width:7px;height:7px;border-radius:50%}
.fw{background:var(--green)}.fd-d{background:var(--yellow)}.fl{background:var(--red)}
.sb{display:flex;flex-direction:column;align-items:center;gap:3px;flex-shrink:0}
.sc{font-size:26px;font-weight:900;color:#fff;letter-spacing:2px;text-shadow:0 0 20px rgba(124,109,250,.4)}
.mt{font-size:11px;font-weight:600;color:var(--text2)}
.cb{padding:9px 16px 13px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid var(--border)}
.pk-prev{display:flex;align-items:center;gap:6px}
.pk-badge{font-size:11px;font-weight:700;padding:4px 10px;border-radius:8px;background:rgba(124,109,250,.2);color:var(--accent);border:1px solid rgba(124,109,250,.3)}
.pk-badge.g{background:rgba(63,250,160,.15);color:var(--green);border-color:rgba(63,250,160,.3)}
.pk-badge.r{background:rgba(250,77,109,.15);color:var(--red);border-color:rgba(250,77,109,.3)}
.btn-an{background:linear-gradient(135deg,rgba(124,109,250,.3),rgba(94,220,255,.2));border:1px solid rgba(124,109,250,.4);color:#fff;font-size:11px;font-weight:700;padding:6px 12px;border-radius:10px;cursor:pointer;transition:all .2s;font-family:inherit}
.btn-an:hover{background:linear-gradient(135deg,rgba(124,109,250,.5),rgba(94,220,255,.35));transform:scale(1.04)}

/* LOADER */
.loader{display:flex;flex-direction:column;align-items:center;gap:12px;padding:50px 20px;color:var(--text3)}
.spin{width:36px;height:36px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--accent2);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty-state{text-align:center;padding:40px 20px;color:var(--text3)}
.empty-state .es-icon{font-size:40px;margin-bottom:10px}
.empty-state p{font-size:14px;line-height:1.6}

/* MODAL */
.modal-overlay{position:fixed;inset:0;z-index:999;background:rgba(4,8,20,.88);backdrop-filter:blur(10px);display:none;align-items:flex-end;justify-content:center}
.modal-overlay.open{display:flex}
.modal{width:100%;max-width:480px;max-height:93vh;overflow-y:auto;background:linear-gradient(170deg,#0d1530 0%,#070d1e 100%);border-radius:28px 28px 0 0;border:1px solid var(--border2);border-bottom:none;animation:slideUp .35s cubic-bezier(.22,1,.36,1);scrollbar-width:thin;scrollbar-color:var(--border) transparent}
@keyframes slideUp{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
.mhandle{width:40px;height:4px;background:var(--border2);border-radius:2px;margin:14px auto 0}
.mhdr{padding:16px 20px 0;display:flex;justify-content:space-between;align-items:flex-start}
.mleague{font-size:11px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
.mteams{font-size:19px;font-weight:800;color:#fff;line-height:1.2}
.mclose{background:var(--glass2);border:1px solid var(--border);color:var(--text2);width:32px;height:32px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;transition:all .2s;font-family:inherit}
.mclose:hover{background:var(--glass3);color:#fff}
.msr{padding:14px 20px;display:flex;align-items:center;gap:10px}
.mtb{flex:1;display:flex;flex-direction:column;gap:5px}
.mtb.away{align-items:flex-end}
.mtn{font-size:15px;font-weight:800}
.mform{display:flex;gap:4px}
.fp{font-size:10px;font-weight:800;width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.fp-w{background:rgba(63,250,160,.2);color:var(--green)}.fp-d{background:rgba(250,219,94,.2);color:var(--yellow)}.fp-l{background:rgba(250,77,109,.2);color:var(--red)}
.msb{padding:10px 18px;background:rgba(0,0,0,.3);border-radius:14px;text-align:center}
.msc{font-size:34px;font-weight:900;letter-spacing:3px}
.mtl{font-size:11px;color:var(--text2);font-weight:600;margin-top:2px}
.mtabs{display:flex;gap:0;margin:14px 20px 0;border-radius:14px;background:var(--glass);border:1px solid var(--border);overflow:hidden}
.mtab{flex:1;padding:10px 6px;border:none;background:transparent;color:var(--text3);font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;font-family:inherit}
.mtab.active{background:rgba(124,109,250,.25);color:#fff}

/* MARKETS */
.mkt-sec{padding:14px 20px}
.mkt{border-radius:16px;background:var(--glass);border:1px solid var(--border);padding:14px 16px;margin-bottom:10px;position:relative;overflow:hidden}
.mkt::before{content:'';position:absolute;top:0;left:0;width:3px;height:100%;border-radius:3px 0 0 3px}
.mkt.t1x2::before{background:var(--accent)}
.mkt.tdo::before{background:var(--accent2)}
.mkt.tbtts::before{background:var(--green)}
.mkt.tgoles::before{background:var(--yellow)}
.mkt.tcorners::before{background:var(--accent3)}
.mkt.tshooter::before{background:linear-gradient(180deg,#ff9a3c,#fa6d9b)}
.mhd{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.mtitle{font-size:13px;font-weight:700;display:flex;align-items:center;gap:7px}
.conf{font-size:10px;font-weight:800;padding:3px 9px;border-radius:50px}
.ch{background:rgba(63,250,160,.15);color:var(--green);border:1px solid rgba(63,250,160,.3)}
.cm-b{background:rgba(250,219,94,.15);color:var(--yellow);border:1px solid rgba(250,219,94,.3)}
.cl{background:rgba(250,77,109,.15);color:var(--red);border:1px solid rgba(250,77,109,.3)}
.opts{display:flex;gap:8px;margin-bottom:10px}
.opt{flex:1;border-radius:12px;padding:10px 8px;text-align:center;cursor:pointer;border:1px solid var(--border);background:var(--glass);transition:all .25s;position:relative}
.opt.rec{border-color:rgba(124,109,250,.5);background:rgba(124,109,250,.15)}
.opt.rec::after{content:'★';position:absolute;top:-7px;right:6px;font-size:11px;color:var(--accent)}
.ol{font-size:11px;color:var(--text3);font-weight:600;margin-bottom:3px}
.ov{font-size:15px;font-weight:800}
.oo{font-size:11px;color:var(--text2);margin-top:2px}
.opt.rec .ov{color:var(--accent)}
.prob-wrap{margin-bottom:8px}
.prob-labels{display:flex;justify-content:space-between;margin-bottom:4px}
.prob-lbl{font-size:10px;font-weight:600;color:var(--text3)}
.prob-bar{height:6px;border-radius:3px;background:var(--border);overflow:hidden;display:flex}
.ps-h{background:var(--accent)}.ps-d{background:var(--yellow)}.ps-a{background:var(--accent3)}
.ai-box{background:rgba(0,0,0,.25);border-radius:12px;padding:12px 14px;margin-top:8px}
.ai-tag{font-size:10px;font-weight:800;color:var(--accent2);text-transform:uppercase;letter-spacing:1px;margin-bottom:5px;display:flex;align-items:center;gap:5px}
.ai-txt{font-size:12px;color:var(--text2);line-height:1.65}
.btn-add{width:100%;padding:12px;border-radius:13px;border:none;font-size:13px;font-weight:700;cursor:pointer;transition:all .25s;margin-top:8px;font-family:inherit}
.btn-add.pri{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.btn-add.pri:hover{box-shadow:0 6px 20px rgba(124,109,250,.4);transform:translateY(-1px)}
.btn-add.done{background:rgba(63,250,160,.15);color:var(--green);border:1px solid rgba(63,250,160,.3)}

/* STATS */
.sts-sec{padding:14px 20px}
.sgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}
.sbox{border-radius:14px;background:var(--glass);border:1px solid var(--border);padding:12px 14px;text-align:center}
.sbn{font-size:20px;font-weight:900;color:var(--accent2)}
.sbl{font-size:10px;color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:.8px;margin-top:3px}
.h2h-row{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-radius:10px;background:var(--glass);margin-bottom:6px;border:1px solid var(--border)}
.h2h-dt{font-size:11px;color:var(--text3);font-weight:600}
.h2h-sc{font-size:13px;font-weight:800}
.h2h-w{font-size:10px;font-weight:700;padding:2px 8px;border-radius:50px}
.hw1{background:rgba(124,109,250,.2);color:var(--accent)}
.hw2{background:rgba(250,109,155,.2);color:var(--accent3)}
.hwd{background:rgba(250,219,94,.2);color:var(--yellow)}

/* TICKET PANEL */
.tpanel{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:998;transition:all .35s cubic-bezier(.22,1,.36,1)}
.tpanel.closed{transform:translate(-50%,calc(100% - 60px))}
.tinner{background:linear-gradient(170deg,#111b3a 0%,#080f22 100%);border:1px solid var(--border2);border-bottom:none;border-radius:24px 24px 0 0;padding:0 0 30px}
.tdrag{display:flex;align-items:center;justify-content:space-between;padding:12px 20px 8px;cursor:pointer}
.ttitle{font-size:14px;font-weight:800;display:flex;align-items:center;gap:8px}
.tarrow{font-size:13px;transition:transform .3s}
.tpanel.closed .tarrow{transform:rotate(180deg)}
.tbody{padding:0 16px}
.tempty{text-align:center;padding:20px;color:var(--text3);font-size:13px}
.prow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--glass);border:1px solid var(--border);margin-bottom:8px;position:relative}
.prow.won{border-color:rgba(63,250,160,.4);background:rgba(63,250,160,.05)}
.prow.lost{border-color:rgba(250,77,109,.4);background:rgba(250,77,109,.05)}
.pe{font-size:16px}
.pinfo{flex:1;display:flex;flex-direction:column;gap:2px}
.pmatch{font-size:12px;font-weight:700}
.pbet{font-size:11px;color:var(--accent2);font-weight:600}
.podds{font-size:14px;font-weight:800;color:var(--accent)}
.prm{background:none;border:none;color:var(--red);cursor:pointer;font-size:16px;padding:4px;font-family:inherit}
.rbadge{font-size:10px;font-weight:800;padding:2px 8px;border-radius:6px;position:absolute;top:8px;right:36px}
.rb-w{background:rgba(63,250,160,.2);color:var(--green)}
.rb-l{background:rgba(250,77,109,.2);color:var(--red)}
.tsum{padding:12px 16px;border-top:1px solid var(--border);margin-top:4px;display:flex;justify-content:space-between;align-items:center}
.tslbl{font-size:11px;color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:.8px}
.tsval{font-size:20px;font-weight:900;color:var(--accent2)}
.tsprob{font-size:12px;color:var(--text2);text-align:right}
.btn-clear{background:rgba(250,77,109,.15);border:1px solid rgba(250,77,109,.3);color:var(--red);font-size:11px;font-weight:700;padding:6px 14px;border-radius:10px;cursor:pointer;margin:8px 16px 0;font-family:inherit}
@media(min-width:481px){
  .modal{border-radius:24px;margin:auto;max-height:88vh}
  .modal-overlay{align-items:center}
}

.phase-chip{flex-shrink:0;padding:6px 13px;border-radius:50px;border:1px solid var(--border);background:var(--glass);color:var(--text3);font-size:11px;font-weight:700;cursor:pointer;transition:all .2s;font-family:inherit;white-space:nowrap}
.phase-chip.active{background:rgba(94,220,255,.2);border-color:var(--accent2);color:#fff}
.group-chip{flex-shrink:0;width:34px;height:34px;border-radius:50%;border:1px solid var(--border);background:var(--glass);color:var(--text3);font-size:12px;font-weight:800;cursor:pointer;transition:all .2s;font-family:inherit;display:flex;align-items:center;justify-content:center}
.group-chip.active{background:rgba(124,109,250,.3);border-color:var(--accent);color:#fff;box-shadow:0 0 12px rgba(124,109,250,.3)}
.wc-group-tag{font-size:10px;font-weight:800;padding:2px 8px;border-radius:6px;background:rgba(124,109,250,.2);color:var(--accent);border:1px solid rgba(124,109,250,.3)}
.wc-phase-tag{font-size:10px;font-weight:800;padding:2px 8px;border-radius:6px}

</style>
</head>
<body>
<div class="bg-orbs">
  <div class="orb orb1"></div>
  <div class="orb orb2"></div>
  <div class="orb orb3"></div>
</div>
<div id="app">
  <header>
    <div class="logo">GVSS<em>PICKS</em></div>
    <div class="header-right">
      <button class="btn-ticket" onclick="toggleTicket()">🎟️ Ticket <span class="badge" id="tcBadge">0</span></button>
    </div>
  </header>

  <!-- SPORT TABS -->
  <div class="sport-tabs">
    <button class="stab active" id="stab-wc" onclick="setSport('wc',this)">🌍 World Cup</button>
    <button class="stab" id="stab-mlb" onclick="setSport('mlb',this)">⚾ MLB</button>
  </div>


<!-- WC PHASE + GROUP FILTER (shown only for World Cup) -->
<div id="wcFilterWrap" style="display:none">
  <div style="padding:0 20px 4px">
    <!-- Phase carousel -->
    <div style="font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px">Fase</div>
    <div style="display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px" id="phaseScroll">
      <button class="phase-chip active" onclick="setPhase(null,this)">Todas</button>

<script>
// ===== CONFIG =====
const PROXIES = [
  'https://corsproxy.io/?',
  'https://api.allorigins.win/raw?url=',
];
const ESPN_BASE = 'https://site.api.espn.com/apis/site/v2/sports';
const SOFA_BASE = 'https://api.sofascore.com/api/v1';
// ESPN league codes
const WC_LEAGUE = 'fifa.world';   // World Cup 2026 ESPN slug
const MLB_URL   = `${ESPN_BASE}/baseball/mlb/scoreboard`;

// Country flags map
const FLAGS = {
  'argentina':'🇦🇷','brazil':'🇧🇷','france':'🇫🇷','germany':'🇩🇪','spain':'🇪🇸',
  'england':'🏴','portugal':'🇵🇹','netherlands':'🇳🇱','italy':'🇮🇹','belgium':'🇧🇪',
  'croatia':'🇭🇷','uruguay':'🇺🇾','colombia':'🇨🇴','mexico':'🇲🇽','usa':'🇺🇸',
  'canada':'🇨🇦','ecuador':'🇪🇨','chile':'🇨🇱','peru':'🇵🇪','paraguay':'🇵🇾',
  'venezuela':'🇻🇪','bolivia':'🇧🇴','japan':'🇯🇵','south korea':'🇰🇷','australia':'🇦🇺',
  'iran':'🇮🇷','saudi arabia':'🇸🇦','qatar':'🇶🇦','morocco':'🇲🇦','senegal':'🇸🇳',
  'nigeria':'🇳🇬','cameroon':'🇨🇲','south africa':'🇿🇦','ghana':'🇬🇭','egypt':'🇪🇬',
  'sweden':'🇸🇪','denmark':'🇩🇰','switzerland':'🇨🇭','austria':'🇦🇹','ukraine':'🇺🇦',
  'poland':'🇵🇱','serbia':'🇷🇸','hungary':'🇭🇺','czechia':'🇨🇿','slovakia':'🇸🇰',
  'turkey':'🇹🇷','wales':'🏴󠁧󠁢󠁷󠁬󠁳󠁿','scotland':'🏴󠁧󠁢󠁳󠁣󠁴󠁿','greece':'🇬🇷',
  'new zealand':'🇳🇿','costa rica':'🇨🇷','honduras':'🇭🇳','el salvador':'🇸🇻',
  'jamaica':'🇯🇲','panama':'🇵🇦','curacao':'🇨🇼','haiti':'🇭🇹','cuba':'🇨🇺',
  'norway':'🇳🇴','finland':'🇫🇮','romania':'🇷🇴','slovenia':'🇸🇮','albania':'🇦🇱',
  'iceland':'🇮🇸','ireland':'🇮🇪','israel':'🇮🇱','georgia':'🇬🇪','kuwait':'🇰🇼',
  'iraq':'🇮🇶','oman':'🇴🇲','bahrain':'🇧🇭','jordan':'🇯🇴','uae':'🇦🇪',
  'uzbekistan':'🇺🇿','indonesia':'🇮🇩','india':'🇮🇳','china':'🇨🇳','mali':'🇲🇱',
  'guinea':'🇬🇳','angola':'🇦🇴','mozambique':'🇲🇿','tanzania':'🇹🇿','kenya':'🇰🇪',
};
function flag(name){
  if(!name) return '🏳️';
  const k=name.toLowerCase();
  for(const [key,val] of Object.entries(FLAGS)){if(k.includes(key)) return val;}
  return '🏳️';
}

// ===== STATE =====
const TODAY=new Date();
let curDate=new Date(TODAY);
let curSport='wc';
let allMatches=[];
let myPicks=JSON.parse(localStorage.getItem('gvss_picks_v2')||'[]');
let ticketOpen=false;
let curMatch=null;
let refreshTimer=null;

// ===== UTILS =====
function pad(n){return String(n).padStart(2,'0')}
function fmtDate(d){return `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}`}
function fmtDateDisplay(d){const days=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];return {day:days[d.getDay()],num:d.getDate()}}
function sameDay(a,b){return a.toDateString()===b.toDateString()}

async function fetchWithProxy(url){
  // Try direct first
  try{
    const r=await fetch(url,{headers:{'Accept':'application/json'},signal:AbortSignal.timeout(5000)});
    if(r.ok) return await r.json();
  }catch(e){}
  // Try proxies
  for(const p of PROXIES){
    try{
      const r=await fetch(p+encodeURIComponent(url),{signal:AbortSignal.timeout(7000)});
      if(r.ok) return await r.json();
    }catch(e){}
  }
  return null;
}

// ===== DATE CAROUSEL =====
function buildCarousel(){
  const sc=document.getElementById('dateScroll');
  sc.innerHTML='';
  for(let i=-2;i<=8;i++){
    const d=new Date(TODAY);d.setDate(d.getDate()+i);
    const {day,num}=fmtDateDisplay(d);
    const ch=document.createElement('div');
    ch.className='date-chip'+(sameDay(d,TODAY)?' today':'')+(sameDay(d,curDate)?' active':'');
    ch.innerHTML=`<span class="dn">${day}</span><span class="dd">${num}</span>`;
    ch.onclick=()=>selectDate(d);
    sc.appendChild(ch);
  }
  // scroll active into view
  setTimeout(()=>{const a=sc.querySelector('.active');if(a)a.scrollIntoView({inline:'center',behavior:'smooth'})},100);
}
function selectDate(d){curDate=d;buildCarousel();loadMatches();}

// ===== SPORT TABS =====
function setSport(s,btn){
  curSport=s;
  document.querySelectorAll('.stab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  // toggle source badges
  document.getElementById('srcESPN').style.display=s==='wc'?'':'none';
  document.getElementById('srcMLB').style.display=s==='mlb'?'':'none';
  loadMatches();
}

// ===== LOAD MATCHES =====
async function loadMatches(){
  clearInterval(refreshTimer);
  document.getElementById('matchesList').innerHTML='<div class="loader"><div class="spin"></div><span>Cargando partidos...</span></div>';
  const dateStr=fmtDate(curDate);
  let data=null;

  if(curSport==='wc'){
    // ESPN World Cup endpoint
    const url=`${ESPN_BASE}/soccer/${WC_LEAGUE}/scoreboard?dates=${dateStr}`;
    data=await fetchWithProxy(url);
    // fallback: try sofascore scheduled events
    if(!data){
      const sfDate=`${curDate.getFullYear()}-${pad(curDate.getMonth()+1)}-${pad(curDate.getDate())}`;
      const sd=await fetchWithProxy(`${SOFA_BASE}/sport/football/scheduled-events/${sfDate}`);
      if(sd) data=parseSofaToESPN(sd,'world_cup');
      document.getElementById('srcESPN').style.display='none';
      document.getElementById('srcSofa').style.display='';
    } else {
      document.getElementById('srcESPN').style.display='';
      document.getElementById('srcSofa').style.display='none';
    }
    allMatches=parseESPNSoccer(data);
  } else {
    // MLB via ESPN
    const url=`${MLB_URL}?dates=${dateStr}`;
    data=await fetchWithProxy(url);
    // fallback: official MLB StatsAPI
    if(!data||!data.events||data.events.length===0){
      const mlbUrl=`https://statsapi.mlb.com/api/v1/schedule?sportId=1&date=${curDate.getFullYear()}-${pad(curDate.getMonth()+1)}-${pad(curDate.getDate())}&hydrate=linescore,team,game(content(editorial(preview)))`;
      const md=await fetchWithProxy(mlbUrl);
      if(md) data=parseMLBStats(md);
      document.getElementById('srcMLB').textContent='⚾ MLB StatsAPI';
    }
    allMatches=parseESPNMLB(data);
  }

  updateStats();
  renderMatches();
  updateSyncTime();

  // Auto-refresh every 60s if any live games
  if(allMatches.some(m=>m.status==='live')){
    document.getElementById('srcLive').style.display='';
    refreshTimer=setInterval(loadMatches,60000);
  } else {
    document.getElementById('srcLive').style.display='none';
  }
}

function updateSyncTime(){
  const now=new Date();
  document.getElementById('syncTime').textContent=`Actualizado ${pad(now.getHours())}:${pad(now.getMinutes())}`;
}

// ===== ESPN SOCCER PARSER =====
function parseESPNSoccer(data){
  if(!data||!data.events) return [];
  return data.events.map(ev=>{
    const comp=ev.competitions[0];
    const home=comp.competitors.find(c=>c.homeAway==='home');
    const away=comp.competitors.find(c=>c.homeAway==='away');
    const st=comp.status;
    let status='pre',minute=null,score=null;
    if(st.type.state==='in'){status='live';minute=st.displayClock||st.period+'''}
    else if(st.type.state==='post'){status='post'}
    if(status!=='pre'){score=`${home.score}-${away.score}`}
    // Time
    const dt=new Date(ev.date);
    const timeStr=`${pad(dt.getHours())}:${pad(dt.getMinutes())}`;
    return {
      id:ev.id,sport:'soccer',
      league:ev.competitions[0].league?.name||'World Cup 2026',
      home:home.team.displayName,homeCode:home.team.abbreviation,
      away:away.team.displayName,awayCode:away.team.abbreviation,
      homeLogo:home.team.logo,awayLogo:away.team.logo,
      homeFlag:flag(home.team.displayName),awayFlag:flag(away.team.displayName),
      time:timeStr,status,score,minute,
      homeForm:genForm(),awayForm:genForm(),
      homeGoals:+(1.2+Math.random()).toFixed(1),awayGoals:+(0.8+Math.random()).toFixed(1),
      homeCorners:+(4+Math.random()*3).toFixed(1),awayCorners:+(3+Math.random()*3).toFixed(1),
      homeShotsOT:+(3+Math.random()*2.5).toFixed(1),awayShotsOT:+(2+Math.random()*2.5).toFixed(1),
      homePoss:Math.round(45+Math.random()*12),
      topShooterHome:{name:home.team.displayName+' #10',shotsOT:+(2.5+Math.random()*2).toFixed(1),goals:Math.floor(5+Math.random()*12)},
      topShooterAway:{name:away.team.displayName+' #9',shotsOT:+(2+Math.random()*2).toFixed(1),goals:Math.floor(3+Math.random()*10)},
      homeYellow:+(1.2+Math.random()).toFixed(1),awayYellow:+(1.4+Math.random()).toFixed(1),
    };
  });
}

// ===== ESPN MLB PARSER =====
function parseESPNMLB(data){
  if(!data||!data.events) return [];
  return data.events.map(ev=>{
    const comp=ev.competitions[0];
    const home=comp.competitors.find(c=>c.homeAway==='home');
    const away=comp.competitors.find(c=>c.homeAway==='away');
    const st=comp.status;
    let status='pre',minute=null,score=null;
    if(st.type.state==='in'){status='live';minute=st.period?'Inn '+st.period:null}
    else if(st.type.state==='post'){status='post'}
    if(status!=='pre'){score=`${away.score}-${home.score}`}
    const dt=new Date(ev.date);
    return {
      id:ev.id,sport:'baseball',league:'⚾ MLB',
      home:home.team.displayName,homeCode:home.team.abbreviation,
      away:away.team.displayName,awayCode:away.team.abbreviation,
      homeLogo:home.team.logo,awayLogo:away.team.logo,
      time:`${pad(dt.getHours())}:${pad(dt.getMinutes())}`,
      status,score,minute,
      homeForm:genForm(),awayForm:genForm(),
      homeGoals:+(3.8+Math.random()*2).toFixed(1),awayGoals:+(3.4+Math.random()*2).toFixed(1),
      topShooterHome:{name:home.team.abbreviation+' Ace',shotsOT:null,goals:+(0.28+Math.random()*0.12).toFixed(3)},
      topShooterAway:{name:away.team.abbreviation+' Ace',shotsOT:null,goals:+(0.25+Math.random()*0.12).toFixed(3)},
    };
  });
}

// ===== MLB STATSAPI FALLBACK PARSER =====
function parseMLBStats(data){
  if(!data||!data.dates||!data.dates[0]) return {events:[]};
  const games=data.dates[0].games||[];
  return {events:games.map(g=>{
    const home=g.teams.home,away=g.teams.away;
    const ls=g.linescore||{};
    let state='pre';
    if(g.status.abstractGameState==='Live') state='in';
    else if(g.status.abstractGameState==='Final') state='post';
    return {
      id:String(g.gamePk),date:g.gameDate,
      competitions:[{
        competitors:[
          {homeAway:'home',team:{displayName:home.team.name,abbreviation:home.team.abbreviation,logo:''},score:String(home.score||0)},
          {homeAway:'away',team:{displayName:away.team.name,abbreviation:away.team.abbreviation,logo:''},score:String(away.score||0)},
        ],
        status:{type:{state},displayClock:ls.currentInningOrdinal||null,period:ls.currentInning||null},
        league:{name:'MLB'},
      }],
    };
  })};
}

// ===== SOFA FALLBACK PARSER =====
function parseSofaToESPN(sd, filter){
  const events=(sd.events||[]).filter(e=>{
    if(filter==='world_cup'){
      const tn=(e.tournament?.name||'').toLowerCase();
      return tn.includes('world cup') || tn.includes('mundial') || tn.includes('fifa');
    }
    return false;
  });
  return {events:events.map(e=>{
    const hm=e.homeTeam,aw=e.awayTeam;
    const sc=e.homeScore,ac=e.awayScore;
    let state='pre';
    if(e.status?.type==='inprogress') state='in';
    else if(e.status?.type==='finished') state='post';
    return {
      id:String(e.id),date:new Date(e.startTimestamp*1000).toISOString(),
      competitions:[{
        competitors:[
          {homeAway:'home',team:{displayName:hm.name,abbreviation:hm.nameCode||hm.slug,logo:''},score:String(sc?.current||0)},
          {homeAway:'away',team:{displayName:aw.name,abbreviation:aw.nameCode||aw.slug,logo:''},score:String(ac?.current||0)},
        ],
        status:{type:{state},displayClock:e.time?.played?e.time.played+"'":'',period:e.time?.period||null},
        league:{name:e.tournament?.name||'World Cup 2026'},
      }],
    };
  })};
}

function genForm(){const r=['W','D','L'];return Array(5).fill(0).map(()=>r[Math.floor(Math.random()*3)])}

// ===== RENDER MATCHES =====
function updateStats(){
  const t=allMatches.length;
  document.getElementById('sTot').textContent=t;
  document.getElementById('sLive').textContent=allMatches.filter(m=>m.status==='live').length;
  document.getElementById('sPre').textContent=allMatches.filter(m=>m.status==='pre').length;
  document.getElementById('sDone').textContent=allMatches.filter(m=>m.status==='post').length;
}

function renderMatches(){
  const list=document.getElementById('matchesList');
  if(!allMatches.length){
    list.innerHTML='<div class="empty-state"><div class="es-icon">📭</div><p>No hay partidos para esta fecha.<br>Intenta con otro día del carrusel.</p></div>';
    return;
  }
  const sorted=[...allMatches].sort((a,b)=>{
    const o={live:0,pre:1,post:2};
    return (o[a.status]-o[b.status])||a.time.localeCompare(b.time);
  });
  list.innerHTML='';
  const secs=[{k:'live',lbl:'🔴 En Vivo'},{k:'pre',lbl:'⏰ Próximos'},{k:'post',lbl:'✅ Finalizados'}];
  secs.forEach(sec=>{
    const items=sorted.filter(m=>m.status===sec.k);
    if(!items.length) return;
    const lbl=document.createElement('div');lbl.className='sec-label';lbl.textContent=sec.lbl;
    list.appendChild(lbl);
    items.forEach(m=>list.appendChild(buildCard(m)));
  });
}

function buildCard(m){
  const card=document.createElement('div');
  const pk=myPicks.find(p=>p.matchId===m.id);
  let extra='';
  if(pk?.result==='won') extra=' won';
  else if(pk?.result==='lost') extra=' lost';
  else if(m.status==='live') extra=' live';
  card.className='match-card'+extra;
  card.onclick=()=>openModal(m);

  const statusHTML=m.status==='live'
    ?`<span class="ms ms-live"><span class="puls"></span>${m.minute||'LIVE'}</span>`
    :m.status==='pre'?`<span class="ms ms-pre">${m.time}</span>`
    :`<span class="ms ms-post">FT</span>`;

  const scoreHTML=m.score
    ?`<span class="sc">${m.score}</span>`
    :`<span class="sc" style="font-size:18px;color:var(--text3)">vs</span>`;

  const hf=m.sport==='soccer'?`<span class="tm-flag">${m.homeFlag||'🏳️'}</span>`:'';
  const af=m.sport==='soccer'?`<span class="tm-flag">${m.awayFlag||'🏳️'}</span>`:'';
  const formH=(m.homeForm||[]).map(r=>`<span class="fd f${r.toLowerCase()==='w'?'w':r.toLowerCase()==='d'?'d-d':'l'}"></span>`).join('');
  const formA=(m.awayForm||[]).map(r=>`<span class="fd f${r.toLowerCase()==='w'?'w':r.toLowerCase()==='d'?'d-d':'l'}"></span>`).join('');

  let pkPrev='<span style="font-size:11px;color:var(--text3)">Sin pick</span>';
  if(pk){
    const bc=pk.result==='won'?' g':pk.result==='lost'?' r':'';
    const lbl=pk.result==='won'?'✅ GANADO':pk.result==='lost'?'❌ PERDIDO':'🎯 '+pk.label;
    pkPrev=`<span class="pk-badge${bc}">${lbl}</span>`;
  }

  card.innerHTML=`
    <div class="ct">
      <div class="li"><span class="li-name">${m.league}</span></div>
      ${statusHTML}
    </div>
    <div class="cm">
      <div class="tm">${hf}<span class="tm-name">${m.home}</span><div class="form-dots">${formH}</div></div>
      <div class="sb">${scoreHTML}${m.status==='live'?`<span class="mt" style="color:var(--green);font-size:10px">EN VIVO</span>`:''}</div>
      <div class="tm away">${af}<span class="tm-name">${m.away}</span><div class="form-dots" style="justify-content:flex-end">${formA}</div></div>
    </div>
    <div class="cb">

// ===== ANALYTICS =====
function calcAI(m){
  const hg=m.homeGoals||1.5,ag=m.awayGoals||1.2;
  const hc=m.homeCorners||5,ac=m.awayCorners||4;
  const hs=m.homeShotsOT||4,as=m.awayShotsOT||3;
  const hWin=Math.min(85,Math.max(15,Math.round(50+(hg-ag)*12+(m.homeForm||[]).filter(x=>x==='W').length*4)));
  const draw=Math.min(40,Math.max(8,Math.round(28-Math.abs(hg-ag)*6)));
  const aWin=Math.max(5,100-hWin-draw);
  const btts=Math.round(((hg>1.1?65:35)+(ag>1.1?65:35))/2);
  const over=Math.min(90,Math.max(18,Math.round(28+(hg+ag-2.5)*22)));
  const cornLine=((hc+ac)*1.05).toFixed(1);
  const cornOver=Math.round(Math.min(85,Math.max(25,(hc+ac)/18*100)));
  return {hWin,draw,aWin,btts,over,cornLine,cornOver,totalGoals:(hg+ag).toFixed(1)};
}
function op(prob){const p=Math.max(5,Math.min(95,prob));return (100/p).toFixed(2);}

      [{l:'Local',v:m.home,o:op(ai.hWin),r:ri===0},{l:'Empate',v:'X',o:op(ai.draw),r:ri===1},{l:'Visit.',v:m.away,o:op(ai.aWin),r:ri===2}],

  return `<div class="mkt ${cls}">
    <div class="mhd"><div class="mtitle"><span>${icon}</span>${title}</div><span class="conf ${conf}">${cLabels[conf]||'Media'}</span></div>

}

function addPick(matchId,market,label,odds){
  const m=allMatches.find(x=>x.id===matchId)||curMatch;
  if(!m) return;
  const idx=myPicks.findIndex(p=>p.matchId===matchId&&p.market===market);
  if(idx>-1) myPicks.splice(idx,1);
  myPicks.push({matchId,market,label,odds:parseFloat(odds),sport:m.sport,home:m.home,away:m.away,result:null});
  savePicks();renderMatches();renderTicket();updateBadges();
  const btn=event.target;const orig=btn.textContent;
  btn.textContent='✅ Agregado';btn.className='btn-add done';
  setTimeout(()=>{btn.textContent=orig;btn.className='btn-add pri';},1800);
}
function removePick(matchId,market){
  myPicks=myPicks.filter(p=>!(p.matchId===matchId&&p.market===market));
  savePicks();renderTicket();updateBadges();renderMatches();
}

function renderTicket(){
  const body=document.getElementById('tBody');

  let html='',total=1;

    total*=p.odds;

};

// Map team name → group
const TEAM_GROUP = {};
Object.entries(WC_GROUPS).forEach(([grp, teams]) => {
  teams.forEach(t => { TEAM_GROUP[t.toLowerCase()] = grp; });
});

// Phase detection by date
function getWCPhase(dateStr) {
  // dateStr = 'YYYYMMDD'
  const d = parseInt(dateStr);
  if (d >= 20260611 && d <= 20260627) return 'Fase de Grupos';
  if (d >= 20260628 && d <= 20260703) return 'Ronda de 32';
  if (d >= 20260704 && d <= 20260707) return 'Octavos de Final';
  if (d >= 20260709 && d <= 20260711) return 'Cuartos de Final';
  if (d >= 20260714 && d <= 20260715) return 'Semifinales';
  if (d === 20260718) return 'Tercer Lugar';
  if (d === 20260719) return '🏆 Final';
  return 'World Cup 2026';
}

function getTeamGroup(name) {
  if (!name) return null;
  const k = name.toLowerCase();
  for (const [key, grp] of Object.entries(TEAM_GROUP)) {
    if (k.includes(key) || key.includes(k.split(' ')[0])) return grp;
  }
  return null;
}

// Phase filter state (null = all)

// ===== ENRICH MATCH WITH WC META =====
function enrichWCMatch(m) {
  if (m.sport !== 'soccer') return m;
  const dateStr = fmtDate(curDate);
  m.wcPhase = getWCPhase(dateStr);
  m.wcGroupHome = getTeamGroup(m.home);
  m.wcGroupAway = getTeamGroup(m.away);
  m.wcGroup = m.wcGroupHome || m.wcGroupAway || null;
  return m;
}

// ===== OVERRIDE renderMatches to apply WC filters =====
const _origRender = renderMatches;
renderMatches = function() {
  let filtered = allMatches.map(m => curSport === 'wc' ? enrichWCMatch(m) : m);

  if (curSport === 'wc') {
    // Phase filter
    if (wcPhaseFilter) {
      filtered = filtered.filter(m => m.wcPhase === wcPhaseFilter);
    }
    // Group filter
    if (wcGroupFilter) {
      filtered = filtered.filter(m => m.wcGroup === wcGroupFilter);
    }
  }

  const list = document.getElementById('matchesList');
  if (!filtered.length && allMatches.length) {
    list.innerHTML = '<div class="empty-state"><div class="es-icon">🔍</div><p>No hay partidos con este filtro.<br>Prueba cambiando la fase o el grupo.</p></div>';
    return;
  }

  // Temporarily swap allMatches for rendering
  const _orig = allMatches;
  allMatches = filtered;
  _origRender();
  allMatches = _orig;
};

// ===== OVERRIDE buildCard to show group/phase tags =====
const _origBuildCard = buildCard;
buildCard = function(m) {
  const card = _origBuildCard(m);
  // Inject group + phase into card-top
  if (curSport === 'wc' && m.wcGroup) {
    const ct = card.querySelector('.ct');
    const li = ct.querySelector('.li');
    const grpTag = document.createElement('span');
    grpTag.className = 'wc-group-tag';
    grpTag.textContent = 'Grupo ' + m.wcGroup;
    li.appendChild(grpTag);
    // Phase tag
    if (m.wcPhase && m.wcPhase !== 'Fase de Grupos') {
      const pc = PHASE_COLORS[m.wcPhase] || {};

      ct.insertBefore(phTag, ct.querySelector('.ms, .ms-live, .ms-pre, .ms-post'));
    }
  }
  return card;
};

// ===== REAL STATS: ESPN SUMMARY ENDPOINT =====
// site.api.espn.com/apis/site/v2/sports/[sport]/[league]/summary?event=[gameId]
const statsCache = {};

async function fetchMatchStats(matchId, sport) {
  if (statsCache[matchId]) return statsCache[matchId];
  const league = sport === 'soccer' ? 'fifa.world' : 'mlb';
  const sportPath = sport === 'soccer' ? 'soccer' : 'baseball';
  const url = `https://site.api.espn.com/apis/site/v2/sports/${sportPath}/${league}/summary?event=${matchId}`;
  const data = await fetchWithProxy(url);
  if (data) statsCache[matchId] = data;
  return data;
}

function parseRealStats(data, sport) {
  if (!data) return null;
  const stats = {};
  try {
    if (sport === 'soccer') {
      // ESPN soccer summary: boxscore.teams[].statistics[]
      const teams = data.boxscore?.teams || [];
      teams.forEach(t => {
        const isHome = t.homeAway === 'home';
        const prefix = isHome ? 'home' : 'away';
        (t.statistics || []).forEach(s => {
          const n = s.name?.toLowerCase() || '';
          const v = parseFloat(s.displayValue) || 0;
          if (n.includes('possession')) stats[prefix + 'Poss'] = v;
          if (n.includes('shot') && n.includes('target')) stats[prefix + 'ShotsOT'] = v;
          if (n.includes('shot') && !n.includes('target')) stats[prefix + 'Shots'] = v;
          if (n.includes('corner')) stats[prefix + 'Corners'] = v;
          if (n.includes('yellow')) stats[prefix + 'Yellow'] = v;
          if (n.includes('red')) stats[prefix + 'Red'] = v;
          if (n.includes('foul')) stats[prefix + 'Fouls'] = v;
          if (n.includes('offside')) stats[prefix + 'Offside'] = v;
          if (n.includes('save')) stats[prefix + 'Saves'] = v;
        });
      });
      // Leaders (top shooters)
      const leaders = data.leaders || [];
      leaders.forEach(lg => {
        const cat = (lg.name || '').toLowerCase();
        if (cat.includes('shot') || cat.includes('goal')) {
          const top = lg.leaders?.[0];
          if (top) {
            const teamId = top.team?.id;
            const homeTm = data.boxscore?.teams?.find(t => t.homeAway === 'home')?.team?.id;
            const prefix = teamId === homeTm ? 'home' : 'away';
            stats['topShooter' + (prefix === 'home' ? 'Home' : 'Away')] = {
              name: top.athlete?.displayName || '',
              shotsOT: parseFloat(top.statistics?.find(s => s.name === 'shotsOnTarget')?.displayValue) || 0,
              goals: parseInt(top.statistics?.find(s => s.name === 'goals')?.displayValue) || 0,
            };
          }
        }
      });
      // Recent form from team records
      const recs = data.header?.competitions?.[0]?.competitors || [];
      recs.forEach(c => {
        const prefix = c.homeAway === 'home' ? 'home' : 'away';
        stats[prefix + 'Record'] = c.records?.[0]?.summary || '';
      });
    } else if (sport === 'baseball') {
      // MLB linescore
      const ls = data.boxscore?.linescore || {};
      const teams = ls.teams || [];
      teams.forEach(t => {
        const prefix = t.team?.homeAway === 'home' ? 'home' : 'away';
        stats[prefix + 'Hits'] = t.hits || 0;
        stats[prefix + 'Errors'] = t.errors || 0;
        stats[prefix + 'Runs'] = t.runs || 0;
      });
      // Pitching leaders
      const leaders = data.leaders || [];
      leaders.forEach(lg => {
        const cat = (lg.name || '').toLowerCase();
        if (cat.includes('era') || cat.includes('pitch')) {
          const top = lg.leaders?.[0];
          if (top) {
            stats['pitcher_' + cat.replace(/\s/g, '_')] = {
              name: top.athlete?.displayName || '',
              value: top.value || 0,
            };
          }
        }
      });
    }
  } catch(e) { console.warn('Stats parse error', e); }
  return stats;
}

// ===== AUTO-MARKING ENGINE =====
async function autoMarkPicks() {
  if (!myPicks.length) return;
  let changed = false;
  // Group picks by matchId to minimize API calls
  const matchIds = [...new Set(myPicks.filter(p => p.result === null).map(p => p.matchId))];
  for (const matchId of matchIds) {
    const pick = myPicks.find(p => p.matchId === matchId);
    if (!pick) continue;
    const data = await fetchMatchStats(matchId, pick.sport);
    if (!data) continue;
    const comp = data.header?.competitions?.[0];
    if (!comp) continue;
    const state = comp.status?.type?.state;
    if (state !== 'post') continue; // only mark finished games
    // Get final score
    const home = comp.competitors?.find(c => c.homeAway === 'home');
    const away = comp.competitors?.find(c => c.homeAway === 'away');
    if (!home || !away) continue;
    const hScore = parseInt(home.score) || 0;
    const aScore = parseInt(away.score) || 0;
    const realStats = parseRealStats(data, pick.sport);
    // Mark all picks for this match
    myPicks.forEach(p => {
      if (p.matchId !== matchId || p.result !== null) return;
      const res = evaluatePick(p, hScore, aScore, realStats, data);
      if (res !== null) { p.result = res; changed = true; }
    });
  }
  if (changed) { savePicks(); renderMatches(); renderTicket(); showAutoMarkToast(); }
}

function evaluatePick(pick, hScore, aScore, stats, data) {
  const market = pick.market;
  const label = pick.label;
  const totalGoals = hScore + aScore;
  const homeName = pick.home;
  const awayName = pick.away;

  if (pick.sport === 'soccer') {
    // 1X2
    if (market === '1X2') {
      if (label === homeName || label === 'Local') return hScore > aScore ? 'won' : 'lost';
      if (label === 'Empate' || label === 'X') return hScore === aScore ? 'won' : 'lost';
      if (label === awayName || label === 'Visitante') return aScore > hScore ? 'won' : 'lost';
    }
    // Doble Oportunidad
    if (market === 'DO') {
      if (label === '1X') return hScore >= aScore ? 'won' : 'lost';
      if (label === 'X2') return aScore >= hScore ? 'won' : 'lost';
      if (label === '12') return hScore !== aScore ? 'won' : 'lost';
    }
    // BTTS
    if (market === 'BTTS') {
      const btts = hScore > 0 && aScore > 0;
      if (label === 'Sí') return btts ? 'won' : 'lost';
      if (label === 'No') return !btts ? 'won' : 'lost';
    }
    // Goles Over/Under
    if (market === 'Goles') {
      const line = parseFloat(label.replace(/[OU]/gi, '').replace('Over', '').replace('Under', '').trim()) || 2.5;
      if (label.startsWith('Over') || label.startsWith('O')) return totalGoals > line ? 'won' : 'lost';
      if (label.startsWith('Under') || label.startsWith('U')) return totalGoals < line ? 'won' : 'lost';
    }
    // Corners (use real stats if available)
    if (market === 'Corners') {
      const totalCorners = (stats?.homeCorners || 0) + (stats?.awayCorners || 0);
      if (!totalCorners) return null; // wait for real data
      const line = parseFloat(label.replace(/[OU]/gi, '').replace('Over', '').replace('Under', '').trim()) || 9.5;
      if (label.startsWith('Over') || label.startsWith('O')) return totalCorners > line ? 'won' : 'lost';
      if (label.startsWith('Under') || label.startsWith('U')) return totalCorners < line ? 'won' : 'lost';
    }
    // Top shooter — can't auto-verify without player stats, skip
    if (market === 'Tirador') return null;
  }

  if (pick.sport === 'baseball') {
    // Moneyline
    if (market === 'ML') {
      if (label === homeName || label === pick.homeCode) return hScore > aScore ? 'won' : 'lost';
      if (label === awayName || label === pick.awayCode) return aScore > hScore ? 'won' : 'lost';
    }
    // Carreras O/U
    if (market === 'CarrerasOU') {
      const line = parseFloat(label.replace(/[OU]/gi, '').replace('Over', '').replace('Under', '').trim()) || 8.5;
      if (label.startsWith('Over') || label.startsWith('O')) return totalGoals > line ? 'won' : 'lost';
      if (label.startsWith('Under') || label.startsWith('U')) return totalGoals < line ? 'won' : 'lost';
    }
    // Runline
    if (market === 'Runline') {
      const diff = hScore - aScore;
      if (label.includes('-1.5')) return diff > 1.5 ? 'won' : 'lost';
      if (label.includes('+1.5')) return diff < 1.5 ? 'won' : 'lost';
    }
  }
  return null;
}

function showAutoMarkToast() {
  const toast = document.createElement('div');
  toast.style.cssText = `position:fixed;bottom:80px;left:50%;transform:translateX(-50%);
    background:linear-gradient(135deg,rgba(63,250,160,0.95),rgba(94,220,255,0.9));
    color:#0a0c16;font-size:12px;font-weight:800;padding:10px 20px;border-radius:50px;
    z-index:9999;animation:fadeInUp .4s ease;box-shadow:0 4px 20px rgba(63,250,160,0.4)`;
  toast.textContent = '✅ Picks actualizados automáticamente';
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 3000);
}

    </div>

    <div class="sgrid">
      <div class="sbox"><div class="sbn" style="font-size:13px;font-weight:800">${m.topShooterHome.name}</div><div class="sbl">${m.topShooterHome.shotsOT} t.arco · ${m.topShooterHome.goals} goles</div></div>
      <div class="sbox"><div class="sbn" style="font-size:13px;font-weight:800">${m.topShooterAway.name}</div><div class="sbl">${m.topShooterAway.shotsOT} t.arco · ${m.topShooterAway.goals} goles</div></div>
    </div>` : ''}
    ${m.homeRecord ? `

    <div class="sgrid">
      <div class="sbox"><div class="sbn" style="font-size:16px">${m.homeRecord}</div><div class="sbl">${m.homeCode}</div></div>
      <div class="sbox"><div class="sbn" style="font-size:16px">${m.awayRecord || '—'}</div><div class="sbl">${m.awayCode}</div></div>
